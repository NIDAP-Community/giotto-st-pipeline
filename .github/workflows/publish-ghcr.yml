name: Publish GHCR Image

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: Push the built image to GHCR
        required: true
        default: true
        type: boolean
      publish_floating_tags:
        description: Also publish latest in addition to sha-<full-git-sha>
        required: true
        default: true
        type: boolean
      platforms:
        description: Comma-separated Docker target platforms
        required: true
        default: linux/amd64
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image name
        shell: bash
        run: |
          echo "IMAGE_NAME=$(echo ghcr.io/${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Record source metadata
        shell: bash
        run: |
          echo "RENV_LOCK_SHA256=$(sha256sum renv.lock | awk '{ print $1 }')" >> "$GITHUB_ENV"
          echo "PIPELINE_VERSION=$(cat VERSION 2>/dev/null || echo unknown)" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: prep
        shell: bash
        run: |
          tags="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          if [[ "${PIPELINE_VERSION}" != "unknown" && -n "${PIPELINE_VERSION}" ]]; then
            tags+=$'\n'"${IMAGE_NAME}:${PIPELINE_VERSION}"
          fi
          if [[ "${{ inputs.publish_floating_tags }}" == "true" ]]; then
            tags+=$'\n'"${IMAGE_NAME}:latest"
          fi
          {
            echo 'tags<<EOF'
            printf '%s\n' "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./container/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push_image }}
          tags: ${{ steps.prep.outputs.tags }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            RENV_LOCK_SHA256=${{ env.RENV_LOCK_SHA256 }}
            PIPELINE_VERSION=${{ env.PIPELINE_VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.renv-lock-sha256=${{ env.RENV_LOCK_SHA256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print published tags
        shell: bash
        run: |
          echo "Image tags prepared:"
          printf '%s\n' "${{ steps.prep.outputs.tags }}"
